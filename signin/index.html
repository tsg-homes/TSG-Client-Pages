<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Open House Sign-In | The Stawasz Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tsg-green:#15464A;
  --tsg-green-dark:#0d2e31;
  --tsg-gray:#f4f5f5;
  --tsg-gray-border:#dfe3e3;
  --tsg-white:#ffffff;
  --tsg-red:#a5342b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Lato',Arial,sans-serif;background:var(--tsg-gray);color:#1c1c1c;-webkit-font-smoothing:antialiased;}
header{background:var(--tsg-green);color:var(--tsg-white);padding:32px 20px 28px;text-align:center;}
header .wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:26px;letter-spacing:1px;}
header .subtitle{margin-top:6px;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:0.85;}
main{max-width:520px;margin:0 auto;padding:24px 16px 80px;}
fieldset{background:var(--tsg-white);border:1px solid var(--tsg-gray-border);border-radius:8px;padding:20px 22px 22px;margin-bottom:18px;}
legend{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:var(--tsg-green);padding:0 6px;}
.field{margin-top:16px;}
.field:first-of-type{margin-top:6px;}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;}
.req{color:var(--tsg-red);}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--tsg-gray-border);border-radius:6px;font-size:15px;font-family:inherit;background:var(--tsg-white);}
textarea{resize:vertical;min-height:70px;}
.errmsg{font-size:12px;color:var(--tsg-red);margin-top:4px;min-height:14px;}
.consent-row{display:flex;align-items:flex-start;gap:10px;margin-top:18px;}
.consent-row input{margin-top:3px;width:auto;}
.consent-row label{font-weight:400;font-size:13px;margin-bottom:0;}
button{background:var(--tsg-green);color:var(--tsg-white);border:none;border-radius:6px;padding:16px;font-size:17px;font-weight:700;font-family:'Lato',Arial,sans-serif;cursor:pointer;width:100%;margin-top:4px;}
button:active{background:var(--tsg-green-dark);}
button:disabled{opacity:0.5;cursor:not-allowed;}
#submitErr{font-size:13px;color:var(--tsg-red);margin-top:10px;text-align:center;min-height:16px;}
#website{position:absolute;left:-9999px;top:-9999px;}
#successBox{display:none;background:var(--tsg-white);border:1px solid var(--tsg-gray-border);border-radius:8px;padding:32px 22px;text-align:center;}
#successBox h2{font-family:'Playfair Display',serif;color:var(--tsg-green);margin-top:0;}
#formWrap.hidden{display:none;}
footer{text-align:center;font-size:11px;color:#8a9494;padding:24px 16px;}
/* QA test mode banner. Deliberately loud, deliberately fixed to the top of the
   viewport, and deliberately NOT in the TSG palette -- it must be impossible
   to scroll past or mistake for part of the real form. Hidden unless doGet
   handed the page a QA test token (see the script block below). */
#qaTestBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#b3271e;color:#fff;font-weight:700;font-size:14px;line-height:1.35;
  text-align:center;padding:12px 14px;letter-spacing:0.3px;
  border-bottom:4px solid #ffd400;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
</style>
<meta name="tsg-hosted-page" content="built from tsg-client-forms by tools/build-site.js; backend https://script.google.com/macros/s/AKfycby9oMzIXMySG6s9qBf1r17gHML4zgtrxOPVt2uAMWvshjPlHDcouDMUITo6hm4Sa-C_lA/exec">
</head>
<body>
<!-- QA TEST MODE banner -- see QA_TEST_TOKEN in the script block at the bottom
     of this file and the QA_TEST_* block in Code.gs. Present in the markup of
     every page load but display:none unless test mode is actually active, so a
     normal visitor's page is visually identical to what it has always been. -->
<div id="qaTestBanner" role="alert">QA TEST MODE — writes are real but tagged, notifications go only to Durand</div>
<header>
  <div class="wordmark">THE STAWASZ GROUP</div>
  <div class="subtitle">Open House Sign-In</div>
</header>
<main>
  <div id="formWrap">
    <form id="signInForm" novalidate>
      <input type="text" id="website" name="website" autocomplete="off" tabindex="-1" aria-hidden="true">

      <fieldset>
        <legend>Open House Details</legend>
        <div class="field">
          <label for="hostingAgent">Hosting Agent</label>
          <!-- 2026-09-07, per Durand: the hardcoded 6-name <option> list was
               removed. The options are now built at page load from
               AGENT_LIST, which doGet fills from FUB's own user roster (see
               getAgentList in Code.gs), so this dropdown can't drift from
               who's actually active in FUB. Only the blank option is markup;
               if the roster fetch fails, AGENT_LIST is [] and the field
               simply stays on "Select one" instead of erroring. -->
          <select id="hostingAgent">
            <option value="">Select one</option>
          </select>
        </div>
        <div class="field">
          <label for="propertyAddress">Property Address</label>
          <input type="text" id="propertyAddress" placeholder="123 Main St, Philadelphia, PA">
        </div>
      </fieldset>

      <fieldset>
        <legend>Your Info</legend>
        <div class="field">
          <label for="visitorName">Full Name <span class="req">*</span></label>
          <input type="text" id="visitorName">
          <div class="errmsg" id="nameErr"></div>
        </div>
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email">
          <div class="errmsg" id="emailErr"></div>
        </div>
        <div class="field">
          <label for="phone">Phone <span class="req">*</span></label>
          <input type="tel" id="phone" placeholder="(555) 555-5555" inputmode="tel">
          <div class="errmsg" id="phoneErr"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>About Your Visit</legend>
        <div class="field">
          <label for="timeframe">Timeframe to Buy</label>
          <!-- 2026-09-07, per Durand: same treatment as Hosting Agent above.
               These labels used to be a hardcoded copy of Code.gs's
               TIMEFRAME_IDS keys that had to match it character for
               character; both are now read live from FUB's /v1/timeframes
               (see getFubTimeframes). The submitted value is still the
               display string, not the numeric id, so the wire format and the
               background note are unchanged. -->
          <select id="timeframe">
            <option value="">Select one</option>
          </select>
        </div>
        <div class="field">
          <label for="howHeard">How Did You Hear About This Open House?</label>
          <select id="howHeard">
            <option value="">Select one</option>
            <option value="Zillow">Zillow</option>
            <option value="Realtor.com">Realtor.com</option>
            <option value="Sign / Drive-by">Sign / Drive-by</option>
            <option value="Agent Referral">Agent Referral</option>
            <option value="Social Media">Social Media</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes"></textarea>
        </div>

        <div class="consent-row">
          <input type="checkbox" id="consent">
          <label for="consent">By checking this box, I agree to be contacted by The Stawasz Group and its agents by phone, text message, and email — including by autodialer or prerecorded message — about this and other properties. Consent is not a condition of any purchase or service. Message and data rates may apply. Reply STOP to opt out at any time. <span class="req">*</span></label>
        </div>
      </fieldset>

      <button type="button" id="submitBtn" disabled>Sign In</button>
      <div id="submitErr"></div>
    </form>
  </div>

  <div id="successBox">
    <h2>Thanks, you're signed in!</h2>
    <p>We've sent your information to the hosting agent.</p>
    <button type="button" id="resetBtn">Sign In Another Visitor</button>
  </div>
</main>
<footer>THE STAWASZ GROUP | KW Empower</footer>

<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var body = { action: 'page.init', form: "open-house", qatest: q.get('qatest') || '', website: '' };
  function fail() {
    var el = document.getElementById('pageLoadError');
    if (!el) {
      el = document.createElement('div');
      el.setAttribute('role', 'alert');
      el.style.cssText = 'background:#FBE4E2;color:#B3261E;font:15px/22px Roboto,Helvetica Neue,Arial,sans-serif;padding:12px 16px;text-align:center';
      el.textContent = 'This page is not working right now. Please try again in a few minutes.';
      document.body.insertBefore(el, document.body.firstChild);
    }
    el.style.display = 'block';
  }
  fetch("https://script.google.com/macros/s/AKfycby9oMzIXMySG6s9qBf1r17gHML4zgtrxOPVt2uAMWvshjPlHDcouDMUITo6hm4Sa-C_lA/exec", { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok || typeof res.submitToken !== 'string') { fail(); return; }
      res.agentList = Array.isArray(res.agentList) ? res.agentList : [];
      res.timeframeList = Array.isArray(res.timeframeList) ? res.timeframeList : [];
      res.param = function (name) { return q.get(name) || ''; };
      __run(res);
    })
    .catch(fail);
})();
function __run(__INIT) {
var ENDPOINT_URL = "https://script.google.com/macros/s/AKfycby9oMzIXMySG6s9qBf1r17gHML4zgtrxOPVt2uAMWvshjPlHDcouDMUITo6hm4Sa-C_lA/exec";
var SUBMIT_TOKEN = __INIT.submitToken;
// QA test mode token. '' on every normal page load; a server-minted UUID only
// when doGet's ?qatest= value matched the QA_TEST_SECRET script property (see
// the QA_TEST_* block in Code.gs). Templated the same way SUBMIT_TOKEN above
// is -- a plain print-scriptlet with no expression escaping -- because like
// SUBMIT_TOKEN this value is
// generated server-side and is never visitor input, so there is nothing for
// safeJsString() to protect against. Holding it does NOT by itself put the
// backend in test mode: doPost re-verifies it against the script cache on
// every submission and ignores it otherwise.
var QA_TEST_TOKEN = __INIT.qaTestToken;
// agent/address/name/email/phone all arrive as public URL query params
// (anyone can craft a link to this exec URL), so they're embedded via
// safeJsString(), not a raw HTML-escaped scriptlet -- see its comment in
// Code.gs for why a plain print-scriptlet is the wrong escaping for a JS string
// literal here.
var PREFILL_AGENT = __INIT.param('agent');
var PREFILL_ADDRESS = __INIT.param('address');
// Added 2026-09-03 for the "Generate Link" setup page: an agent who
// already knows who's coming can bake their name/email/phone into the
// link so the visitor only has to confirm it. Optional -- all default to
// '' and the form behaves exactly as before when none are present.
var PREFILL_NAME = __INIT.param('name');
var PREFILL_EMAIL = __INIT.param('email');
var PREFILL_PHONE = __INIT.param('phone');
// 2026-09-07, per Durand: the Hosting Agent and Timeframe dropdowns are
// built from FUB's own lists instead of hardcoded <option> markup -- see
// getAgentList / getFubTimeframes in Code.gs. Both are already JSON (each is
// JSON.stringify'd server-side), so they're embedded through the raw,
// force-printing scriptlet form rather than safeJsString(): unlike the
// prefill values above, neither contains anything a visitor can put in a
// query param. Both fail open to [], in which case the dropdown keeps just
// its blank option.
var AGENT_LIST = __INIT.agentList;
var TIMEFRAME_LIST = __INIT.timeframeList;
// Requires a real-looking TLD (2+ letters) — matches the tightened check in
// Code.gs, so a bad email is caught here first with a clear inline message
// instead of round-tripping to FUB and coming back as a generic error.
var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;

// Show the QA test banner (and push the page down so it isn't covered by the
// fixed banner) whenever this page load is a test session, so Durand can never
// mistake a test form for the real one at a glance.
if (QA_TEST_TOKEN) {
  var qaBannerEl = document.getElementById('qaTestBanner');
  qaBannerEl.style.display = 'block';
  document.body.style.paddingTop = qaBannerEl.offsetHeight + 'px';
}

AGENT_LIST.forEach(a => {
  const opt = document.createElement('option');
  opt.value = a.name;
  opt.textContent = a.name;
  document.getElementById('hostingAgent').appendChild(opt);
});
TIMEFRAME_LIST.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t.name;
  opt.textContent = t.name;
  document.getElementById('timeframe').appendChild(opt);
});

// Must run AFTER the options above are appended -- setting .value on a
// <select> that doesn't yet contain a matching <option> silently does
// nothing, so a ?agent=... prefill would have been dropped if this stayed
// where it was.
document.getElementById('hostingAgent').value = PREFILL_AGENT;
document.getElementById('propertyAddress').value = PREFILL_ADDRESS;

var nameEl = document.getElementById('visitorName');
var emailEl = document.getElementById('email');
var phoneEl = document.getElementById('phone');

// Prefill the visitor's own info when a hosting agent already knows it
// (see OpenHouseSetup.html). The visitor can still edit any of these.
if (PREFILL_NAME) nameEl.value = PREFILL_NAME;
if (PREFILL_EMAIL) emailEl.value = PREFILL_EMAIL.trim().toLowerCase();
if (PREFILL_PHONE) phoneEl.value = formatPhoneDisplay(digitsOnly(PREFILL_PHONE));
var consentEl = document.getElementById('consent');
var submitBtn = document.getElementById('submitBtn');

function digitsOnly(s) { return (s || '').replace(/\D/g, ''); }
function collapseSpaces(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

// ---------- Live formatting ----------
function formatPhoneDisplay(digits) {
  digits = digits.slice(0, 10);
  var len = digits.length;
  if (len === 0) return '';
  if (len < 4) return '(' + digits;
  if (len < 7) return '(' + digits.slice(0, 3) + ') ' + digits.slice(3);
  return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6, 10);
}

phoneEl.addEventListener('input', function () {
  var digits = digitsOnly(phoneEl.value).slice(0, 15);
  // Standard 10-digit US numbers get the (555) 555-5555 treatment; longer
  // entries (country code, extension) are left as plain digits rather than
  // forced into a format that wouldn't fit them.
  phoneEl.value = digits.length <= 10 ? formatPhoneDisplay(digits) : digits;
  validateForm();
});

[nameEl, document.getElementById('propertyAddress')].forEach(function (el) {
  el.addEventListener('blur', function () { this.value = collapseSpaces(this.value); });
});

emailEl.addEventListener('blur', function () { this.value = this.value.trim().toLowerCase(); validateForm(); });
document.getElementById('notes').addEventListener('blur', function () { this.value = this.value.trim(); });

// ---------- Validation ----------
function validateForm() {
  var nameOk = nameEl.value.trim().length > 0;
  var emailOk = EMAIL_PATTERN.test(emailEl.value.trim());
  var phoneDigits = digitsOnly(phoneEl.value);
  var phoneOk = phoneDigits.length >= 10 && phoneDigits.length <= 15;
  var consentOk = consentEl.checked;

  document.getElementById('nameErr').textContent = (!nameOk && nameEl.value.length > 0) ? 'Name is required.' : '';
  document.getElementById('emailErr').textContent = (!emailOk && emailEl.value.length > 0) ? 'Enter a valid email address (e.g. name@example.com).' : '';
  document.getElementById('phoneErr').textContent = (!phoneOk && phoneEl.value.length > 0) ? 'Enter a valid 10-digit phone number.' : '';

  submitBtn.disabled = !(nameOk && emailOk && phoneOk && consentOk);
}

[nameEl, emailEl, phoneEl, consentEl].forEach(function (el) {
  el.addEventListener('input', validateForm);
  el.addEventListener('change', validateForm);
});

submitBtn.addEventListener('click', function () {
  // Final normalization pass right before building the payload, in case a
  // field was edited after its own blur/change fired.
  nameEl.value = collapseSpaces(nameEl.value);
  emailEl.value = emailEl.value.trim().toLowerCase();
  document.getElementById('propertyAddress').value = collapseSpaces(document.getElementById('propertyAddress').value);
  document.getElementById('notes').value = document.getElementById('notes').value.trim();

  validateForm();
  if (submitBtn.disabled) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing In...';
  document.getElementById('submitErr').textContent = '';

  var data = {
    website: document.getElementById('website').value,
    formToken: SUBMIT_TOKEN,
    visitorName: nameEl.value,
    email: emailEl.value,
    phone: digitsOnly(phoneEl.value),
    hostingAgent: document.getElementById('hostingAgent').value,
    propertyAddress: document.getElementById('propertyAddress').value,
    timeframe: document.getElementById('timeframe').value,
    howHeard: document.getElementById('howHeard').value,
    followUpConsent: consentEl.checked ? 'Yes' : 'No',
    notes: document.getElementById('notes').value
  };

  // Only sent when this page load was actually issued a test token. The key is
  // omitted entirely otherwise, so a normal submission's payload is byte-for-
  // byte what it has always been.
  if (QA_TEST_TOKEN) data.qaTestToken = QA_TEST_TOKEN;

  fetch(ENDPOINT_URL, { method: 'POST', body: JSON.stringify(data) })
    .then(function (resp) { return resp.json(); })
    .then(function (result) {
      if (result.ok) {
        document.getElementById('formWrap').classList.add('hidden');
        document.getElementById('successBox').style.display = 'block';
      } else {
        document.getElementById('submitErr').textContent = result.error || 'Something went wrong. Try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    })
    .catch(function () {
      document.getElementById('submitErr').textContent = 'Network error. Check your connection and try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    });
});

document.getElementById('resetBtn').addEventListener('click', function () {
  nameEl.value = '';
  emailEl.value = '';
  phoneEl.value = '';
  document.getElementById('timeframe').value = '';
  document.getElementById('howHeard').value = '';
  document.getElementById('notes').value = '';
  consentEl.checked = false;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sign In';
  document.getElementById('submitErr').textContent = '';
  document.getElementById('successBox').style.display = 'none';
  document.getElementById('formWrap').classList.remove('hidden');
});

}
</script>
</body>
</html>
